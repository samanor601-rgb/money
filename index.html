<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧理財記帳本</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* 隱藏滾動條但保持滾動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 模擬手機外框影與圓角 */
        .app-container {
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen sm:p-4">

    <!-- App 容器 -->
    <div class="app-container w-full overflow-hidden sm:rounded-3xl relative flex flex-col">
        
        <!-- 頂部 Header -->
        <header class="bg-indigo-600 text-white p-4 pt-6 rounded-b-3xl shadow-md sticky top-0 z-10">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid font-bold fa-wallet"></i>
                    </div>
                    <div>
                        <h1 class="text-xs text-indigo-200">智慧理財記帳</h1>
                        <p class="text-sm font-semibold">資產看板</p>
                    </div>
                </div>
                
                <!-- 成員切換選單與記一筆按鈕 -->
                <div class="flex items-center gap-2">
                    <select id="member-filter" class="bg-indigo-500/80 text-white border border-indigo-400/40 text-xs rounded-full px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-white">
                        <option value="all">👥 全部成員</option>
                        <option value="男主人">👨 男主人</option>
                        <option value="女主人">👩 女主人</option>
                    </select>
                    <button id="add-btn" class="bg-white text-indigo-600 px-3 py-1.5 rounded-full text-xs font-bold shadow hover:bg-indigo-50 transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 記一筆
                    </button>
                </div>
            </div>

            <!-- 資產總覽卡片 -->
            <div class="bg-indigo-700/60 backdrop-blur-md rounded-2xl p-4 border border-indigo-400/30">
                <div class="text-xs text-indigo-200 mb-1">淨資產預估 (TWD)</div>
                <div class="text-2xl font-extrabold tracking-tight mb-3" id="total-net-worth">NT$ 0</div>
                <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-indigo-500/40 text-xs">
                    <div>
                        <div class="text-indigo-200">本月收入</div>
                        <div class="font-bold text-emerald-300" id="month-income">+0</div>
                    </div>
                    <div>
                        <div class="text-indigo-200">本月支出</div>
                        <div class="font-bold text-rose-300" id="month-expense">-0</div>
                    </div>
                    <div>
                        <div class="text-indigo-200">投資損益</div>
                        <div class="font-bold text-amber-300" id="invest-pnl">+0</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主要內容區域 (切換頁面) -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24 space-y-4">
            
            <!-- 頁面 1: 總覽/明細 (預設) -->
            <section id="page-dashboard" class="space-y-4">
                <!-- 投資組合摘要 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-line text-indigo-500"></i> 理財投資現況
                        </h2>
                        <span class="text-xs font-medium text-slate-400" id="invest-count">0 筆持股</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs mb-3">
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div class="text-slate-400">投資總投入成本</div>
                            <div class="font-bold text-slate-700 mt-0.5" id="invest-cost">NT$ 0</div>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div class="text-slate-400">目前預估總市值</div>
                            <div class="font-bold text-indigo-600 mt-0.5" id="invest-market-value">NT$ 0</div>
                        </div>
                    </div>
                </div>

                <!-- 交易動態列表 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-list-ul text-indigo-500"></i> 最近帳務紀錄
                        </h2>
                        <button id="view-all-records" class="text-xs text-indigo-600 hover:underline font-medium">查看全部</button>
                    </div>
                    <div id="recent-transactions" class="space-y-2.5">
                        <!-- 動態插入交易 -->
                    </div>
                </div>
            </section>

            <!-- 頁面 2: 統計圖表 -->
            <section id="page-analytics" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-pie text-indigo-500"></i> 本月支出分析
                    </h2>
                    <div class="w-full flex justify-center py-2">
                        <div class="w-48 h-48">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-column text-indigo-500"></i> 投資組合分布
                    </h2>
                    <div class="w-full flex justify-center py-2">
                        <div class="w-48 h-48">
                            <canvas id="assetChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 頁面 3: 資產與投資明細 -->
            <section id="page-portfolio" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-coins text-amber-500"></i> 持有投資明細
                        </h2>
                    </div>
                    <div id="portfolio-list" class="space-y-3">
                        <!-- 動態插入投資項目 -->
                    </div>
                </div>
            </section>

        </main>

        <!-- 底部導覽列 Navigation Bar -->
        <nav class="bg-white/90 backdrop-blur-md border-t border-slate-200 fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto z-20 flex justify-around items-center py-2 px-4 shadow-lg sm:rounded-b-3xl">
            <button data-target="page-dashboard" class="nav-item flex flex-col items-center gap-1 text-indigo-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">總覽</span>
            </button>
            <button data-target="page-analytics" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-medium">分析</span>
            </button>
            <button id="center-add-btn" class="flex flex-col items-center justify-center -mt-5 bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg shadow-indigo-300 active:scale-90 transition">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
            <button data-target="page-portfolio" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-vault text-lg"></i>
                <span class="text-[10px] font-medium">投資</span>
            </button>
            <button id="settings-btn" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span class="text-[10px] font-medium">設定</span>
            </button>
        </nav>

        <!-- 新增登錄 Modal 表單 -->
        <div id="entry-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden flex items-end sm:items-center justify-center">
            <div class="bg-white w-full max-w-[480px] rounded-t-3xl sm:rounded-3xl p-5 space-y-4 animate-in slide-in-from-bottom duration-300">
                <div class="flex justify-between items-center pb-2 border-b">
                    <h3 class="text-base font-bold text-slate-800" id="modal-title">新增記帳紀錄</h3>
                    <button id="close-modal" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- 類別切換：收支 / 投資 -->
                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                    <button id="type-expense" class="type-btn flex-1 py-2 rounded-lg bg-white shadow-sm text-slate-800 transition">日常支出</button>
                    <button id="type-income" class="type-btn flex-1 py-2 rounded-lg text-slate-500 transition">日常收入</button>
                    <button id="type-investment" class="type-btn flex-1 py-2 rounded-lg text-slate-500 transition">理財投資</button>
                </div>

                <!-- 表單內容 -->
                <form id="record-form" class="space-y-3">
                    <input type="hidden" id="entry-type" value="expense">

                    <!-- 成員選擇與金額 -->
                    <div class="grid grid-cols-5 gap-2">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-500 mb-1 font-medium">歸屬成員</label>
                            <select id="entry-member" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:border-indigo-500">
                                <option value="男主人">👨 男主人</option>
                                <option value="女主人">👩 女主人</option>
                            </select>
                        </div>
                        <div class="col-span-3">
                            <label class="block text-xs text-slate-500 mb-1 font-medium">金額 (TWD)</label>
                            <div class="relative">
                                <span class="absolute left-2.5 top-2.5 text-slate-400 text-sm font-bold">NT$</span>
                                <input type="number" id="entry-amount" required step="any" placeholder="0" class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-lg text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- 日常收支分類 (非投資時顯示) -->
                    <div id="category-wrapper">
                        <label class="block text-xs text-slate-500 mb-1 font-medium">分類</label>
                        <select id="entry-category" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                            <option value="餐飲食品">🍔 餐飲食品</option>
                            <option value="交通出行">🚗 交通出行</option>
                            <option value="休閒娛樂">🎮 休閒娛樂</option>
                            <option value="居家日常">🏠 居家日常</option>
                            <option value="薪資收入">💰 薪資收入</option>
                            <option value="其他">📦 其他收支</option>
                        </select>
                    </div>

                    <!-- 投資專用欄位 (投資時顯示) -->
                    <div id="invest-fields" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">投資標的名稱 / 代碼</label>
                            <input type="text" id="invest-name" placeholder="例如：台積電 (2330), S&P 500" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">投資動作</label>
                                <select id="invest-action" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                                    <option value="buy">買入 (Buy)</option>
                                    <option value="sell">賣出 (Sell)</option>
                                    <option value="dividend">領取股利/配息</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">目前單價/現值</label>
                                <input type="number" id="invest-price" step="any" placeholder="當前市場價格" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- 備註說明與日期 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">日期</label>
                            <input type="date" id="entry-date" required class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">備註</label>
                            <input type="text" id="entry-note" placeholder="可選填..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition active:scale-95">
                        儲存紀錄
                    </button>
                </form>
            </div>
        </div>

        <!-- 提示訊息 Toast -->
        <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-msg">已新增成功</span>
        </div>

    </div>

    <!-- JavaScript 應用邏輯 -->
    <script>
        // 預設示範資料 (更新成員為男主人與女主人)
        let records = [
            { id: 1, type: 'expense', member: '男主人', amount: 120, category: '餐飲食品', note: '午餐牛肉麵', date: '2026-11-09' },
            { id: 2, type: 'expense', member: '女主人', amount: 55, category: '交通出行', note: '捷運車資', date: '2026-11-09' },
            { id: 3, type: 'income', member: '男主人', amount: 45000, category: '薪資收入', note: '11月薪水', date: '2026-11-05' },
            { id: 4, type: 'investment', member: '男主人', amount: 15000, name: '台積電 (2330)', action: 'buy', currentPrice: 16500, note: '定期定額', date: '2026-11-01' },
            { id: 5, type: 'investment', member: '女主人', amount: 10000, name: '元大高股息 (0056)', action: 'buy', currentPrice: 10800, note: '買進持有', date: '2026-10-25' }
        ];

        let currentMemberFilter = 'all';
        let expenseChart = null;
        let assetChart = null;

        // 初始化頁面與事件
        window.onload = function() {
            // 設定日期預設值為今天
            document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
            
            // 成員篩選切換
            document.getElementById('member-filter').addEventListener('change', (e) => {
                currentMemberFilter = e.target.value;
                renderApp();
            });

            initTabs();
            initModalEvents();
            initTypeSwitch();
            renderApp();
        };

        // 底部導覽頁籤切換邏輯
        function initTabs() {
            const navItems = document.querySelectorAll('.nav-item[data-target]');
            const pages = [
                document.getElementById('page-dashboard'),
                document.getElementById('page-analytics'),
                document.getElementById('page-portfolio')
            ];

            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const targetId = item.getAttribute('data-target');
                    if (!targetId) return;

                    // 切換頁面顯示
                    pages.forEach(page => {
                        if (page) {
                            if (page.id === targetId) {
                                page.classList.remove('hidden');
                            } else {
                                page.classList.add('hidden');
                            }
                        }
                    });

                    // 更新導覽列按鈕樣式
                    navItems.forEach(nav => {
                        if (nav.getAttribute('data-target') === targetId) {
                            nav.classList.remove('text-slate-400');
                            nav.classList.add('text-indigo-600');
                        } else {
                            nav.classList.remove('text-indigo-600');
                            nav.classList.add('text-slate-400');
                        }
                    });

                    // 重新渲染圖表 (防止畫布尺寸在隱藏狀態下繪製異常)
                    if (targetId === 'page-analytics') {
                        setTimeout(renderCharts, 50);
                    }
                });
            });

            // 查看全部按鈕切換至明細頁
            const viewAllBtn = document.getElementById('view-all-records');
            if (viewAllBtn) {
                viewAllBtn.addEventListener('click', () => {
                    const portfolioNav = document.querySelector('.nav-item[data-target="page-portfolio"]');
                    if (portfolioNav) portfolioNav.click();
                });
            }
        }

        // 取得目前篩選後的紀錄
        function getFilteredRecords() {
            if (currentMemberFilter === 'all') return records;
            return records.filter(r => (r.member || '男主人') === currentMemberFilter);
        }

        // 格式化金額顯示
        function formatMoney(amount) {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);
        }

        // 渲染整體 UI
        function renderApp() {
            updateDashboard();
            renderTransactions();
            renderPortfolio();
            renderCharts();
        }

        // 更新頂部總覽數值
        function updateDashboard() {
            const filtered = getFilteredRecords();
            let totalIncome = 0;
            let totalExpense = 0;
            let investCost = 0;
            let investMarketValue = 0;

            filtered.forEach(r => {
                if (r.type === 'income') totalIncome += r.amount;
                if (r.type === 'expense') totalExpense += r.amount;
                if (r.type === 'investment') {
                    if (r.action === 'buy') {
                        investCost += r.amount;
                        investMarketValue += (r.currentPrice || r.amount);
                    } else if (r.action === 'sell') {
                        investCost -= r.amount;
                    }
                }
            });

            const investPnL = investMarketValue - investCost;
            const netWorth = (totalIncome - totalExpense) + investMarketValue;

            document.getElementById('total-net-worth').textContent = formatMoney(netWorth);
            document.getElementById('month-income').textContent = '+' + formatMoney(totalIncome).replace('NT$', '');
            document.getElementById('month-expense').textContent = '-' + formatMoney(totalExpense).replace('NT$', '');
            document.getElementById('invest-pnl').textContent = (investPnL >= 0 ? '+' : '') + formatMoney(investPnL).replace('NT$', '');
            
            document.getElementById('invest-cost').textContent = formatMoney(investCost);
            document.getElementById('invest-market-value').textContent = formatMoney(investMarketValue);
        }

        // 渲染最近交易紀錄
        function renderTransactions() {
            const container = document.getElementById('recent-transactions');
            container.innerHTML = '';

            const filtered = getFilteredRecords();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">目前尚無該成員的帳務紀錄</div>`;
                return;
            }

            filtered.slice(0, 5).forEach(item => {
                let iconClass = 'fa-tag text-slate-400';
                let amountColor = 'text-slate-800';
                let typeBadge = '';
                let amountPrefix = '';

                if (item.type === 'expense') {
                    iconClass = 'fa-arrow-down text-rose-500 bg-rose-50';
                    amountColor = 'text-rose-600';
                    amountPrefix = '-';
                } else if (item.type === 'income') {
                    iconClass = 'fa-arrow-up text-emerald-500 bg-emerald-50';
                    amountColor = 'text-emerald-600';
                    amountPrefix = '+';
                } else if (item.type === 'investment') {
                    iconClass = 'fa-chart-line text-indigo-500 bg-indigo-50';
                    amountColor = 'text-indigo-600';
                    typeBadge = `<span class="text-[10px] bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded ml-1">投資</span>`;
                }

                const memberBadge = `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-normal mr-1">${item.member || '男主人'}</span>`;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2.5 rounded-xl hover:bg-slate-50 transition border border-slate-100/60';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs ${iconClass.includes('bg-') ? iconClass.split(' ').pop() : 'bg-slate-100'}">
                            <i class="fa-solid ${iconClass.split(' ')[0]} ${iconClass.split(' ')[1]}"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-slate-800 flex items-center">
                                ${memberBadge}
                                ${item.type === 'investment' ? item.name : item.category}
                                ${typeBadge}
                            </div>
                            <div class="text-[10px] text-slate-400">${item.date} ${item.note ? '• ' + item.note : ''}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-bold ${amountColor}">${amountPrefix}${formatMoney(item.amount)}</div>
                        <button onclick="deleteRecord(${item.id})" class="text-[10px] text-slate-300 hover:text-rose-500">刪除</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 渲染投資持股項目
        function renderPortfolio() {
            const container = document.getElementById('portfolio-list');
            container.innerHTML = '';

            const filtered = getFilteredRecords();
            const investments = filtered.filter(r => r.type === 'investment');
            document.getElementById('invest-count').textContent = `${investments.length} 筆持股`;

            if (investments.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">目前尚無投資持股紀錄</div>`;
                return;
            }

            investments.forEach(item => {
                const cost = item.amount;
                const marketVal = item.currentPrice || cost;
                const pnl = marketVal - cost;
                const roi = ((pnl / cost) * 100).toFixed(2);
                const isPositive = pnl >= 0;

                const card = document.createElement('div');
                card.className = 'p-3 rounded-xl bg-slate-50 border border-slate-100 space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] bg-indigo-100 text-indigo-700 font-semibold px-1.5 py-0.5 rounded">${item.member || '男主人'}</span>
                            <span class="text-xs font-bold text-slate-800">${item.name}</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isPositive ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${isPositive ? '+' : ''}${roi}%
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-1 text-[11px]">
                        <div>
                            <span class="text-slate-400 block">投入成本</span>
                            <span class="font-semibold text-slate-700">${formatMoney(cost)}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block">預估市值</span>
                            <span class="font-semibold text-slate-700">${formatMoney(marketVal)}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block">未實現損益</span>
                            <span class="font-bold ${isPositive ? 'text-emerald-600' : 'text-rose-600'}">${isPositive ? '+' : ''}${formatMoney(pnl)}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 渲染圖表 (Chart.js)
        function renderCharts() {
            const filtered = getFilteredRecords();

            // 1. 支出圓餅圖
            const expenseData = {};
            filtered.filter(r => r.type === 'expense').forEach(r => {
                expenseData[r.category] = (expenseData[r.category] || 0) + r.amount;
            });

            const ctx1 = document.getElementById('expenseChart').getContext('2d');
            if (expenseChart) expenseChart.destroy();
            expenseChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseData).length ? Object.keys(expenseData) : ['尚無資料'],
                    datasets: [{
                        data: Object.values(expenseData).length ? Object.values(expenseData) : [1],
                        backgroundColor: ['#f43f5e', '#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#64748b']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
                }
            });

            // 2. 資產投資分布圖
            const investData = {};
            filtered.filter(r => r.type === 'investment').forEach(r => {
                investData[r.name] = (investData[r.name] || 0) + (r.currentPrice || r.amount);
            });

            const ctx2 = document.getElementById('assetChart').getContext('2d');
            if (assetChart) assetChart.destroy();
            assetChart = new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: Object.keys(investData).length ? Object.keys(investData) : ['尚無持股'],
                    datasets: [{
                        data: Object.values(investData).length ? Object.values(investData) : [1],
                        backgroundColor: ['#6366f1', '#06b6d4', '#14b8a6', '#ec4899', '#eab308']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
                }
            });
        }

        // Modal 與類型按鈕事件
        function initModalEvents() {
            const modal = document.getElementById('entry-modal');
            const openBtns = [document.getElementById('add-btn'), document.getElementById('center-add-btn')];
            const closeBtn = document.getElementById('close-modal');
            const form = document.getElementById('record-form');

            openBtns.forEach(btn => btn.addEventListener('click', () => modal.classList.remove('hidden')));
            closeBtn.addEventListener('click', () => modal.classList.add('hidden'));

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const type = document.getElementById('entry-type').value;
                const member = document.getElementById('entry-member').value;
                const amount = parseFloat(document.getElementById('entry-amount').value);
                const date = document.getElementById('entry-date').value;
                const note = document.getElementById('entry-note').value;

                let newEntry = { id: Date.now(), type, member, amount, date, note };

                if (type === 'investment') {
                    newEntry.name = document.getElementById('invest-name').value || '未命名資產';
                    newEntry.action = document.getElementById('invest-action').value;
                    const priceInput = parseFloat(document.getElementById('invest-price').value);
                    newEntry.currentPrice = isNaN(priceInput) ? amount : priceInput;
                } else {
                    newEntry.category = document.getElementById('entry-category').value;
                }

                records.unshift(newEntry);
                form.reset();
                document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
                modal.classList.add('hidden');
                
                showToast(`已成功新增 ${member} 的紀錄！`);
                renderApp();
            });
        }

        // 交易類型切換頁籤 (日常支出/收入/投資)
        function initTypeSwitch() {
            const typeBtns = document.querySelectorAll('.type-btn');
            const typeInput = document.getElementById('entry-type');
            const catWrapper = document.getElementById('category-wrapper');
            const investFields = document.getElementById('invest-fields');

            typeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    typeBtns.forEach(b => {
                        b.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                        b.classList.add('text-slate-500');
                    });
                    btn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                    btn.classList.remove('text-slate-500');

                    if (btn.id === 'type-expense') {
                        typeInput.value = 'expense';
                        catWrapper.classList.remove('hidden');
                        investFields.classList.add('hidden');
                    } else if (btn.id === 'type-income') {
                        typeInput.value = 'income';
                        catWrapper.classList.remove('hidden');
                        investFields.classList.add('hidden');
                    } else if (btn.id === 'type-investment') {
                        typeInput.value = 'investment';
                        catWrapper.classList.add('hidden');
                        investFields.classList.remove('hidden');
                    }
                });
            });
        }

        // 顯示 Toast 訊息
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
