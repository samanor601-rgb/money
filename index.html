<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雙人共同記帳本</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter / Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col max-w-md mx-auto shadow-2xl relative pb-20">

  <!-- 頂部 Header -->
  <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold fa-wallet text-xl text-emerald-200"></i>
        <h1 class="text-lg font-bold tracking-wide">雙人共享記帳</h1>
      </div>
      <button id="btnSettings" class="p-2 text-emerald-100 hover:text-white rounded-full transition-colors focus:outline-none">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 提示訊息 Modal (Alert modal replacement) -->
  <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300 w-11/12 max-w-xs">
    <div id="toastBody" class="px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm text-center flex items-center justify-center space-x-2">
      <i id="toastIcon" class="fa-solid fa-check-circle text-lg"></i>
      <span id="toastMsg">成功寫入！</span>
    </div>
  </div>

  <!-- 設定 GAS URL Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-all">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-link text-emerald-600 mr-2"></i>設定 Google 網頁應用程式 URL</h3>
        <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-4 leading-relaxed">
        請貼上你部署 Google Apps Script 後取得的「Web App URL」，即可將資料同步寫入你與伴侶的 Google 試算表。
      </p>
      <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" 
        class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none mb-4 font-mono">
      
      <div class="flex space-x-2">
        <button id="btnSaveUrl" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md hover:bg-emerald-700 active:scale-95 transition-all">
          儲存並連線
        </button>
      </div>
    </div>
  </div>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 space-x-0 space-y-4 overflow-y-auto no-scrollbar">

    <!-- TAB 導覽切換 -->
    <div class="flex bg-slate-200 p-1 rounded-xl font-medium text-sm text-slate-600">
      <button id="tabAdd" class="flex-1 py-2 rounded-lg font-semibold bg-white text-emerald-700 shadow-sm transition-all text-center">
        <i class="fa-solid fa-plus-circle mr-1"></i>快速記帳
      </button>
      <button id="tabDashboard" class="flex-1 py-2 rounded-lg font-semibold transition-all text-center">
        <i class="fa-solid fa-chart-pie mr-1"></i>結算與看板
      </button>
    </div>

    <!-- 頁面 1: 快速記帳區塊 -->
    <section id="sectionAdd" class="space-y-4">
      <form id="recordForm" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
        
        <!-- 收支類型 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 rounded-lg">類型</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="type" value="支出" checked class="peer hidden">
              <div class="py-2.5 text-center text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 peer-checked:bg-rose-500 peer-checked:text-white transition-all">
                <i class="fa-solid fa-minus-circle mr-1"></i>支出
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="type" value="收入" class="peer hidden">
              <div class="py-2.5 text-center text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 peer-checked:bg-emerald-600 peer-checked:text-white transition-all">
                <i class="fa-solid fa-plus-circle mr-1"></i>收入
              </div>
            </label>
          </div>
        </div>

        <!-- 金額 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (NT$)</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400 font-bold text-lg">$</span>
            <input type="number" id="amount" required placeholder="0" step="any" inputmode="decimal"
              class="w-full pl-8 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-2xl font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
          </div>
        </div>

        <!-- 記帳人 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">誰付的錢？ (記帳人)</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="payer" value="成員A" checked class="peer hidden">
              <div class="py-2.5 text-center text-sm font-medium rounded-xl bg-slate-100 text-slate-700 peer-checked:bg-teal-700 peer-checked:text-white peer-checked:font-bold border border-transparent transition-all">
                <i class="fa-solid fa-user-large mr-1 text-xs"></i>成員A
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="payer" value="成員B" class="peer hidden">
              <div class="py-2.5 text-center text-sm font-medium rounded-xl bg-slate-100 text-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:font-bold border border-transparent transition-all">
                <i class="fa-solid fa-user-large mr-1 text-xs"></i>成員B
              </div>
            </label>
          </div>
        </div>

        <!-- 分帳模式 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">分帳模式</label>
          <select id="splitMode" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="共同支出（各出一半）">🤝 共同支出 (各出一半)</option>
            <option value="成員A 幫 成員B 全墊">💸 成員A 幫 成員B 全墊</option>
            <option value="成員B 幫 成員A 全墊">💸 成員B 幫 成員A 全墊</option>
            <option value="個人私用支出（不計入雙人分帳）">🔒 個人私用支出 (不分帳)</option>
          </select>
        </div>

        <!-- 分類 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-category="外食" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-emerald-50 border-emerald-500 text-emerald-700 font-bold">
              🍔 外食
            </button>
            <button type="button" data-category="超市食材" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600">
              🛒 超市食材
            </button>
            <button type="button" data-category="日常用品" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600">
              🧻 日常用品
            </button>
            <button type="button" data-category="房租水電" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600">
              🏠 房租水電
            </button>
            <button type="button" data-category="娛樂" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600">
              🎬 娛樂
            </button>
            <button type="button" data-category="其他" class="cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600">
              📦 其他
            </button>
          </div>
        </div>

        <!-- 日期 & 備註 -->
        <div class="grid grid-cols-1 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
            <input type="date" id="date" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">備註 (可填)</label>
            <input type="text" id="note" placeholder="例：午餐便當、全聯買菜" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 active:scale-95 transition-all text-base flex items-center justify-center space-x-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>送出記帳紀錄</span>
        </button>

      </form>
    </section>

    <!-- 頁面 2: 統計與分帳看板 -->
    <section id="sectionDashboard" class="space-y-4 hidden">
      
      <!-- 重新整理按鈕區 -->
      <div class="flex justify-between items-center px-1">
        <span class="text-xs text-slate-500">最新即時數據</span>
        <button id="btnRefresh" class="text-xs text-emerald-700 font-semibold flex items-center space-x-1 hover:underline active:opacity-75">
          <i class="fa-solid fa-rotate-right"></i>
          <span>重新整理</span>
        </button>
      </div>

      <!-- 核心結算卡片 (最顯眼) -->
      <div id="settlementCard" class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-xl space-y-3 relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>

        <div class="text-xs text-slate-400 font-medium tracking-wider uppercase">雙人分帳精算結果</div>
        
        <div id="settlementResult" class="py-2">
          <div class="text-2xl font-black text-amber-300">計算中...</div>
          <div class="text-xs text-slate-300 mt-1">請確認已於設定輸入 GAS Web App URL。</div>
        </div>

        <div class="pt-2 border-t border-slate-700/60 flex justify-between text-xs text-slate-300">
          <span>本月共同總支出:</span>
          <span id="jointExpenseTotal" class="font-bold text-white">$ 0</span>
        </div>
      </div>

      <!-- 個人付額小卡片 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-1">
          <div class="flex items-center space-x-1.5 text-xs text-teal-700 font-bold">
            <span class="w-2 h-2 rounded-full bg-teal-600"></span>
            <span>成員A 總付款</span>
          </div>
          <div id="payerATotal" class="text-xl font-bold text-slate-800">$ 0</div>
          <div class="text-[10px] text-slate-400">含私用與全墊金額</div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-1">
          <div class="flex items-center space-x-1.5 text-xs text-indigo-600 font-bold">
            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
            <span>成員B 總付款</span>
          </div>
          <div id="payerBTotal" class="text-xl font-bold text-slate-800">$ 0</div>
          <div class="text-[10px] text-slate-400">含私用與全墊金額</div>
        </div>
      </div>

      <!-- 最新 10 筆明細清單 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <h3 class="text-xs font-bold text-slate-500 tracking-wider">最近 10 筆記帳流水帳</h3>
        
        <div id="recentRecordsList" class="space-y-2.5">
          <!-- 動態渲染流水帳 -->
          <div class="text-center py-6 text-slate-400 text-xs">載入紀錄中...</div>
        </div>
      </div>

    </section>

  </main>

  <script>
    // === 全局狀態管理 ===
    let currentCategory = '外食';
    let gasUrl = localStorage.getItem('ACCOUNTING_GAS_URL') || '';

    // 初始化頁面
    document.addEventListener('DOMContentLoaded', () => {
      // 預設日期設為今天 (YYYY-MM-DD)
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;

      // 如果尚未設定 URL，自動彈出設定框
      if (!gasUrl) {
        document.getElementById('settingsModal').classList.remove('hidden');
      } else {
        document.getElementById('gasUrlInput').value = gasUrl;
        fetchDashboardData();
      }
    });

    // === TAB 切換邏輯 ===
    const tabAdd = document.getElementById('tabAdd');
    const tabDashboard = document.getElementById('tabDashboard');
    const sectionAdd = document.getElementById('sectionAdd');
    const sectionDashboard = document.getElementById('sectionDashboard');

    tabAdd.addEventListener('click', () => {
      tabAdd.className = 'flex-1 py-2 rounded-lg font-semibold bg-white text-emerald-700 shadow-sm transition-all text-center';
      tabDashboard.className = 'flex-1 py-2 rounded-lg font-semibold transition-all text-center';
      sectionAdd.classList.remove('hidden');
      sectionDashboard.classList.add('hidden');
    });

    tabDashboard.addEventListener('click', () => {
      tabDashboard.className = 'flex-1 py-2 rounded-lg font-semibold bg-white text-emerald-700 shadow-sm transition-all text-center';
      tabAdd.className = 'flex-1 py-2 rounded-lg font-semibold transition-all text-center';
      sectionDashboard.classList.remove('hidden');
      sectionAdd.classList.add('hidden');
      fetchDashboardData(); // 切換到看板時重新加載
    });

    // === 分類按鈕選取 ===
    const catBtns = document.querySelectorAll('.cat-btn');
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => {
          b.className = 'cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-slate-200 bg-slate-50 text-slate-600';
        });
        btn.className = 'cat-btn py-2 px-1 text-center text-xs font-medium rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-700 font-bold';
        currentCategory = btn.getAttribute('data-category');
      });
    });

    // === 設定視窗控制 ===
    document.getElementById('btnSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('hidden');
    });
    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('hidden');
    });
    document.getElementById('btnSaveUrl').addEventListener('click', () => {
      const url = document.getElementById('gasUrlInput').value.trim();
      if (!url) {
        showToast('請輸入有效的 URL', false);
        return;
      }
      gasUrl = url;
      localStorage.setItem('ACCOUNTING_GAS_URL', gasUrl);
      document.getElementById('settingsModal').classList.add('hidden');
      showToast('已成功連線設定！', true);
      fetchDashboardData();
    });

    // === 表單送出 (新增記帳) ===
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!gasUrl) {
        showToast('請先設定 API 網址！', false);
        document.getElementById('settingsModal').classList.remove('hidden');
        return;
      }

      const type = document.querySelector('input[name="type"]:checked').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const payer = document.querySelector('input[name="payer"]:checked').value;
      const splitMode = document.getElementById('splitMode').value;
      const date = document.getElementById('date').value;
      const note = document.getElementById('note').value.trim();

      const payload = {
        action: 'addRecord',
        date,
        type,
        amount,
        payer,
        splitMode,
        category: currentCategory,
        note
      };

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-50');
      btnSubmit.querySelector('span').innerText = '儲存中...';

      try {
        // 使用 fetch 發送 POST
        const res = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // GAS 避開 CORS 常用設置
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          showToast('寫入成功！', true);
          document.getElementById('amount').value = '';
          document.getElementById('note').value = '';
        } else {
          showToast('寫入失敗：' + result.message, false);
        }
      } catch (err) {
        console.error(err);
        showToast('連線異常，請重新嘗試', false);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-50');
        btnSubmit.querySelector('span').innerText = '送出記帳紀錄';
      }
    });

    // === 手動重新整理 ===
    document.getElementById('btnRefresh').addEventListener('click', () => {
      fetchDashboardData();
    });

    // === 撈取後端統計與最新流水帳 ===
    async function fetchDashboardData() {
      if (!gasUrl) {
        const resCard = document.getElementById('settlementResult');
        resCard.innerHTML = `
          <div class="text-xl font-bold text-amber-300">尚未連線 API</div>
          <div class="text-xs text-slate-300 mt-1">請點選右上角 ⚙️ 設定 Google Web App URL。</div>
        `;
        document.getElementById('recentRecordsList').innerHTML = `
          <div class="text-center py-6 text-slate-400 text-xs">請先設定 API 網址以載入雲端紀錄</div>
        `;
        return;
      }

      const resCard = document.getElementById('settlementResult');
      resCard.innerHTML = `<div class="text-sm text-amber-200 animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-2"></i>即時試算與同步中...</div>`;

      try {
        const fetchUrl = gasUrl + (gasUrl.includes('?') ? '&' : '?') + `action=getSummary&t=${Date.now()}`;
        const res = await fetch(fetchUrl, {
          method: 'GET',
          redirect: 'follow'
        });
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();

        if (data.status === 'success') {
          renderDashboard(data);
        } else {
          resCard.innerHTML = `<div class="text-xs text-rose-300">讀取資料錯誤：${data.message || '未知錯誤'}</div>`;
        }
      } catch (err) {
        console.warn('GAS Fetch Notice:', err);
        resCard.innerHTML = `
          <div class="text-sm font-bold text-rose-300"><i class="fa-solid fa-triangle-exclamation mr-1"></i>連線至 Google 失敗</div>
          <div class="text-[11px] text-slate-300 mt-1">請確認 Web App URL 是否正確且部署權限設為「所有人」。</div>
        `;
        document.getElementById('recentRecordsList').innerHTML = `
          <div class="text-center py-4 text-slate-400 text-xs">無法讀取資料，請檢查 API 設定與網路連線。</div>
        `;
      }
    }

    // === 渲染統計結果與流水帳 ===
    function renderDashboard(data) {
      const summary = data.summary;
      
      // 顯示個人總付額
      document.getElementById('payerATotal').innerText = `$ ${summary.payerA_paid.toLocaleString()}`;
      document.getElementById('payerBTotal').innerText = `$ ${summary.payerB_paid.toLocaleString()}`;
      document.getElementById('jointExpenseTotal').innerText = `$ ${summary.joint_expense.toLocaleString()}`;

      // 核心分帳卡片渲染
      const resCard = document.getElementById('settlementResult');
      const net = summary.netBalance; // 關鍵正負差額: 正數代表 B 需給 A；負數代表 A 需給 B

      if (Math.abs(net) < 1) {
        resCard.innerHTML = `
          <div class="text-xl font-bold text-emerald-300">🎉 目前帳目完全平衡！</div>
          <div class="text-xs text-slate-300 mt-1">兩人無須補貼任何金額。</div>
        `;
      } else if (net > 0) {
        resCard.innerHTML = `
          <div class="text-xs text-slate-300 mb-0.5">結算應支付：</div>
          <div class="text-2xl font-black text-amber-300 tracking-wide">
            成員B <span class="text-white text-base">應給</span> 成員A <span class="text-3xl text-emerald-400">$${Math.round(net).toLocaleString()}</span>
          </div>
        `;
      } else {
        resCard.innerHTML = `
          <div class="text-xs text-slate-300 mb-0.5">結算應支付：</div>
          <div class="text-2xl font-black text-amber-300 tracking-wide">
            成員A <span class="text-white text-base">應給</span> 成員B <span class="text-3xl text-emerald-400">$${Math.round(Math.abs(net)).toLocaleString()}</span>
          </div>
        `;
      }

      // 渲染最新 10 筆紀錄
      const listElem = document.getElementById('recentRecordsList');
      if (!data.recent || data.recent.length === 0) {
        listElem.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">目前無任何記帳資料</div>`;
        return;
      }

      let html = '';
      data.recent.forEach(item => {
        const isExp = item.type === '支出';
        const badgeColor = item.payer === '成員A' ? 'bg-teal-100 text-teal-800' : 'bg-indigo-100 text-indigo-800';
        
        html += `
          <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs ${isExp ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}">
                <i class="fa-solid ${getCategoryIcon(item.category)}"></i>
              </div>
              <div>
                <div class="flex items-center space-x-1.5">
                  <span class="text-xs font-bold text-slate-800">${item.category}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded-md font-semibold ${badgeColor}">${item.payer}</span>
                </div>
                <div class="text-[10px] text-slate-400">${item.date} ${item.note ? '• ' + item.note : ''}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold ${isExp ? 'text-slate-800' : 'text-emerald-600'}">
                ${isExp ? '-' : '+'}$${Number(item.amount).toLocaleString()}
              </div>
              <div class="text-[9px] text-slate-400">${item.splitMode.split('（')[0]}</div>
            </div>
          </div>
        `;
      });
      listElem.innerHTML = html;
    }

    // 分類圖示輔助函式
    function getCategoryIcon(cat) {
      switch(cat) {
        case '外食': return 'fa-utensils';
        case '超市食材': return 'fa-cart-shopping';
        case '日常用品': return 'fa-toilet-paper';
        case '房租水電': return 'fa-house';
        case '娛樂': return 'fa-film';
        default: return 'fa-box';
      }
    }

    // === Toast 動態提示 ===
    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast');
      const toastBody = document.getElementById('toastBody');
      const toastIcon = document.getElementById('toastIcon');
      const toastMsg = document.getElementById('toastMsg');

      toastMsg.innerText = msg;
      if (isSuccess) {
        toastBody.className = 'px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm text-center flex items-center justify-center space-x-2 bg-emerald-600';
        toastIcon.className = 'fa-solid fa-check-circle text-lg';
      } else {
        toastBody.className = 'px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm text-center flex items-center justify-center space-x-2 bg-rose-600';
        toastIcon.className = 'fa-solid fa-circle-exclamation text-lg';
      }

      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }
  </script>
</body>
</html>
