<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sam & Even 的理財記帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* 隱藏滾動條但保持滾動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 模擬手機外框影與圓角 */
        .app-container {
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen sm:p-4">

    <!-- App 容器 -->
    <div class="app-container w-full overflow-hidden sm:rounded-3xl relative flex flex-col">
        
        <!-- 頂部 Header -->
        <header class="bg-indigo-600 text-white p-4 pt-6 rounded-b-3xl shadow-md sticky top-0 z-10">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid font-bold fa-wallet"></i>
                    </div>
                    <div>
                        <h1 class="text-xs text-indigo-200">智慧理財記帳</h1>
                        <p class="text-sm font-semibold">Sam & Even 的理財記帳</p>
                    </div>
                </div>
                
                <!-- 成員切換選單與記一筆按鈕 -->
                <div class="flex items-center gap-2">
                    <select id="member-filter" class="bg-indigo-500/80 text-white border border-indigo-400/40 text-xs rounded-full px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-white">
                        <option value="all">👥 全部成員</option>
                        <option value="Sam">👨 Sam</option>
                        <option value="Even">👩 Even</option>
                    </select>
                    <button id="add-btn" class="bg-white text-indigo-600 px-3 py-1.5 rounded-full text-xs font-bold shadow hover:bg-indigo-50 transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 記一筆
                    </button>
                </div>
            </div>

            <!-- 資產總覽卡片 -->
            <div class="bg-indigo-700/60 backdrop-blur-md rounded-2xl p-4 border border-indigo-400/30">
                <div class="text-xs text-indigo-200 mb-1">淨資產預估 (TWD)</div>
                <div class="text-2xl font-extrabold tracking-tight mb-3" id="total-net-worth">NT$ 0</div>
                <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-indigo-500/40 text-xs">
                    <div>
                        <div class="text-indigo-200">本月收入</div>
                        <div class="font-bold text-emerald-300" id="month-income">+0</div>
                    </div>
                    <div>
                        <div class="text-indigo-200">本月支出</div>
                        <div class="font-bold text-rose-300" id="month-expense">-0</div>
                    </div>
                    <div>
                        <div class="text-indigo-200">投資損益</div>
                        <div class="font-bold text-amber-300" id="invest-pnl">+0</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主要內容區域 (切換頁面) -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24 space-y-4">
            
            <!-- 頁面 1: 總覽/明細 (預設) -->
            <section id="page-dashboard" class="space-y-4">
                <!-- 投資組合摘要 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-line text-indigo-500"></i> 理財投資現況
                        </h2>
                        <span class="text-xs font-medium text-slate-400" id="invest-count">0 筆持股</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs mb-3">
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div class="text-slate-400">投資總投入成本</div>
                            <div class="font-bold text-slate-700 mt-0.5" id="invest-cost">NT$ 0</div>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div class="text-slate-400">目前預估總市值</div>
                            <div class="font-bold text-indigo-600 mt-0.5" id="invest-market-value">NT$ 0</div>
                        </div>
                    </div>
                </div>

                <!-- 交易動態列表 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-list-ul text-indigo-500"></i> 最近帳務紀錄
                        </h2>
                        <button id="view-all-records" class="text-xs text-indigo-600 hover:underline font-medium">查看全部</button>
                    </div>
                    <div id="recent-transactions" class="space-y-2.5">
                        <!-- 動態插入交易 -->
                    </div>
                </div>
            </section>

            <!-- 頁面 2: 統計圖表 -->
            <section id="page-analytics" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-pie text-indigo-500"></i> 本月支出分析
                    </h2>
                    <div class="w-full flex justify-center py-2">
                        <div class="w-48 h-48">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-column text-indigo-500"></i> 投資組合分布
                    </h2>
                    <div class="w-full flex justify-center py-2">
                        <div class="w-48 h-48">
                            <canvas id="assetChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 頁面 3: 資產與投資明細 -->
            <section id="page-portfolio" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-coins text-amber-500"></i> 持有投資明細
                        </h2>
                    </div>
                    <div id="portfolio-list" class="space-y-3">
                        <!-- 動態插入投資項目 -->
                    </div>
                </div>
            </section>

            <!-- 頁面 4: 設定頁面 -->
            <section id="page-settings" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
                    <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5 border-b pb-2">
                        <i class="fa-solid fa-sliders text-indigo-500"></i> 系統設定與管理
                    </h2>

                    <!-- 成員暱稱設定 -->
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-slate-700">成員名稱自訂</label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <span class="text-[11px] text-slate-400 block mb-1">👨 成員 1 顯示名稱</span>
                                <input type="text" id="setting-member1" value="Sam" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 block mb-1">👩 成員 2 顯示名稱</span>
                                <input type="text" id="setting-member2" value="Even" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <button id="save-settings-btn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition active:scale-95">
                            儲存成員稱呼
                        </button>
                    </div>

                    <hr class="border-slate-100">

                    <!-- 每月預算警示上限 -->
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-slate-700">本月支出預算提醒</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2 text-slate-400 text-xs font-bold">NT$</span>
                            <input type="number" id="setting-budget" placeholder="未設定上限" class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- 資料管理 -->
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-slate-700">資料管理</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="reset-demo-btn" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition active:scale-95">
                                <i class="fa-solid fa-rotate-left mr-1"></i> 重置範例資料
                            </button>
                            <button id="clear-all-btn" class="py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl text-xs transition active:scale-95">
                                <i class="fa-solid fa-trash-can mr-1"></i> 清空所有紀錄
                            </button>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- 底部導覽列 Navigation Bar -->
        <nav class="bg-white/90 backdrop-blur-md border-t border-slate-200 fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto z-20 flex justify-around items-center py-2 px-4 shadow-lg sm:rounded-b-3xl">
            <button data-target="page-dashboard" class="nav-item flex flex-col items-center gap-1 text-indigo-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">總覽</span>
            </button>
            <button data-target="page-analytics" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-medium">分析</span>
            </button>
            <button id="center-add-btn" class="flex flex-col items-center justify-center -mt-5 bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg shadow-indigo-300 active:scale-90 transition">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
            <button data-target="page-portfolio" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-vault text-lg"></i>
                <span class="text-[10px] font-medium">投資</span>
            </button>
            <button data-target="page-settings" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-500">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span class="text-[10px] font-medium">設定</span>
            </button>
        </nav>

        <!-- 新增登錄 Modal 表單 -->
        <div id="entry-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden flex items-end sm:items-center justify-center">
            <div class="bg-white w-full max-w-[480px] rounded-t-3xl sm:rounded-3xl p-5 space-y-4 animate-in slide-in-from-bottom duration-300">
                <div class="flex justify-between items-center pb-2 border-b">
                    <h3 class="text-base font-bold text-slate-800" id="modal-title">新增記帳紀錄</h3>
                    <button id="close-modal" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- 類別切換：收支 / 投資 -->
                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                    <button id="type-expense" class="type-btn flex-1 py-2 rounded-lg bg-white shadow-sm text-slate-800 transition">日常支出</button>
                    <button id="type-income" class="type-btn flex-1 py-2 rounded-lg text-slate-500 transition">日常收入</button>
                    <button id="type-investment" class="type-btn flex-1 py-2 rounded-lg text-slate-500 transition">理財投資</button>
                </div>

                <!-- 表單內容 -->
                <form id="record-form" class="space-y-3">
                    <input type="hidden" id="entry-type" value="expense">

                    <!-- 成員選擇與金額 -->
                    <div class="grid grid-cols-5 gap-2">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-500 mb-1 font-medium">歸屬成員</label>
                            <select id="entry-member" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:border-indigo-500">
                                <option value="Sam">👨 Sam</option>
                                <option value="Even">👩 Even</option>
                            </select>
                        </div>
                        <div class="col-span-3">
                            <label class="block text-xs text-slate-500 mb-1 font-medium">金額 (TWD)</label>
                            <div class="relative">
                                <span class="absolute left-2.5 top-2.5 text-slate-400 text-sm font-bold">NT$</span>
                                <input type="number" id="entry-amount" required step="any" placeholder="0" class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-lg text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- 日常收支分類 (非投資時顯示) -->
                    <div id="category-wrapper">
                        <label class="block text-xs text-slate-500 mb-1 font-medium">分類</label>
                        <select id="entry-category" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                            <option value="餐飲食品">🍔 餐飲食品</option>
                            <option value="交通出行">🚗 交通出行</option>
                            <option value="休閒娛樂">🎮 休閒娛樂</option>
                            <option value="居家日常">🏠 居家日常</option>
                            <option value="薪資收入">💰 薪資收入</option>
                            <option value="其他">📦 其他收支</option>
                        </select>
                    </div>

                    <!-- 投資專用欄位 (投資時顯示) -->
                    <div id="invest-fields" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">投資標的名稱 / 代碼</label>
                            <input type="text" id="invest-name" placeholder="例如：台積電 (2330), S&P 500" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">投資動作</label>
                                <select id="invest-action" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                                    <option value="buy">買入 (Buy)</option>
                                    <option value="sell">賣出 (Sell)</option>
                                    <option value="dividend">領取股利/配息</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">目前單價/現值</label>
                                <input type="number" id="invest-price" step="any" placeholder="當前市場價格" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- 備註說明與日期 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">日期</label>
                            <input type="date" id="entry-date" required class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">備註</label>
                            <input type="text" id="entry-note" placeholder="可選填..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition active:scale-95">
                        儲存紀錄
                    </button>
                </form>
            </div>
        </div>

        <!-- 提示訊息 Toast -->
        <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-msg">已新增成功</span>
        </div>

    </div>

    <!-- JavaScript 應用邏輯 -->
    <script>
        // 預設示範資料 (更新成員為 Sam 與 Even)
        let memberNames = {
            m1: 'Sam',
            m2: 'Even'
        };

        let defaultRecords = [
            { id: 1, type: 'expense', member: 'Sam', amount: 120, category: '餐飲食品', note: '午餐牛肉麵', date: '2026-11-09' },
            { id: 2, type: 'expense', member: 'Even', amount: 55, category: '交通出行', note: '捷運車資', date: '2026-11-09' },
            { id: 3, type: 'income', member: 'Sam', amount: 45000, category: '薪資收入', note: '11月薪水', date: '2026-11-05' },
            { id: 4, type: 'investment', member: 'Sam', amount: 15000, name: '台積電 (2330)', action: 'buy', currentPrice: 16500, note: '定期定額', date: '2026-11-01' },
            { id: 5, type: 'investment', member: 'Even', amount: 10000, name: '元大高股息 (0056)', action: 'buy', currentPrice: 10800, note: '買進持有', date: '2026-10-25' }
        ];

        let records = [];

        let currentMemberFilter = 'all';
        let expenseChart = null;
        let assetChart = null;

        // 從 localStorage 讀取資料
        function loadStoredData() {
            try {
                const savedRecords = localStorage.getItem('sam_even_records');
                if (savedRecords) {
                    records = JSON.parse(savedRecords);
                } else {
                    records = [...defaultRecords];
                }

                const savedMembers = localStorage.getItem('sam_even_members');
                if (savedMembers) {
                    memberNames = JSON.parse(savedMembers);
                    updateMemberNamesUI();
                }
            } catch (e) {
                console.error('無法讀取本地儲存資料:', e);
                records = [...defaultRecords];
            }
        }

        // 儲存資料至 localStorage
        function saveData() {
            try {
                localStorage.setItem('sam_even_records', JSON.stringify(records));
                localStorage.setItem('sam_even_members', JSON.stringify(memberNames));
            } catch (e) {
                console.error('無法儲存資料至本地:', e);
            }
        }

        // 更新成員 UI 選單
        function updateMemberNamesUI() {
            const m1Val = memberNames.m1;
            const m2Val = memberNames.m2;

            document.getElementById('setting-member1').value = m1Val;
            document.getElementById('setting-member2').value = m2Val;

            const filterSelect = document.getElementById('member-filter');
            if (filterSelect) {
                filterSelect.options[1].text = `👨 ${m1Val}`;
                filterSelect.options[1].value = m1Val;
                filterSelect.options[2].text = `👩 ${m2Val}`;
                filterSelect.options[2].value = m2Val;
            }

            const modalMemberSelect = document.getElementById('entry-member');
            if (modalMemberSelect) {
                modalMemberSelect.options[0].text = `👨 ${m1Val}`;
                modalMemberSelect.options[0].value = m1Val;
                modalMemberSelect.options[1].text = `👩 ${m2Val}`;
                modalMemberSelect.options[1].value = m2Val;
            }
        }

        // 初始化頁面與事件
        window.onload = function() {
            // 設定日期預設值為今天
            document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
            
            // 讀取本地儲存
            loadStoredData();

            // 成員篩選切換
            document.getElementById('member-filter').addEventListener('change', (e) => {
                currentMemberFilter = e.target.value;
                renderApp();
            });

            initTabs();
            initModalEvents();
            initTypeSwitch();
            initSettingsEvents();
            renderApp();
        };

        // 初始化 Modal 彈窗事件
        function initModalEvents() {
            const modal = document.getElementById('entry-modal');
            const addBtn = document.getElementById('add-btn');
            const centerAddBtn = document.getElementById('center-add-btn');
            const closeModalBtn = document.getElementById('close-modal');
            const recordForm = document.getElementById('record-form');

            const openModal = () => {
                modal.classList.remove('hidden');
            };

            const closeModal = () => {
                modal.classList.add('hidden');
            };

            if (addBtn) addBtn.addEventListener('click', openModal);
            if (centerAddBtn) centerAddBtn.addEventListener('click', openModal);
            if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);

            // 點擊背景遮罩關閉
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 新增交易表單提交
            recordForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const type = document.getElementById('entry-type').value;
                const member = document.getElementById('entry-member').value;
                const amount = parseFloat(document.getElementById('entry-amount').value) || 0;
                const category = document.getElementById('entry-category').value;
                const date = document.getElementById('entry-date').value;
                const note = document.getElementById('entry-note').value;

                let newRecord = {
                    id: Date.now(),
                    type,
                    member,
                    amount,
                    date,
                    note
                };

                if (type === 'investment') {
                    const name = document.getElementById('invest-name').value || '未具名投資';
                    const action = document.getElementById('invest-action').value;
                    const price = parseFloat(document.getElementById('invest-price').value) || amount;
                    newRecord.name = name;
                    newRecord.action = action;
                    newRecord.currentPrice = price;
                } else {
                    newRecord.category = category;
                }

                records.unshift(newRecord);
                saveData(); // 自動儲存至 localStorage
                closeModal();
                recordForm.reset();
                document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
                showToast('紀錄已成功儲存！');
                renderApp();
            });
        }

        // 渲染整體 App 資料與 UI
        function renderApp() {
            // 篩選符合當前選取成員的紀錄
            const filteredRecords = records.filter(r => {
                if (currentMemberFilter === 'all') return true;
                return r.member === currentMemberFilter;
            });

            let totalIncome = 0;
            let totalExpense = 0;
            let investCost = 0;
            let investMarketValue = 0;

            const portfolioMap = {};

            filteredRecords.forEach(r => {
                if (r.type === 'income') {
                    totalIncome += r.amount;
                } else if (r.type === 'expense') {
                    totalExpense += r.amount;
                } else if (r.type === 'investment') {
                    if (r.action === 'buy') {
                        investCost += r.amount;
                        investMarketValue += (r.currentPrice || r.amount);
                    } else if (r.action === 'sell') {
                        investCost -= r.amount;
                        investMarketValue -= (r.currentPrice || r.amount);
                    } else if (r.action === 'dividend') {
                        totalIncome += r.amount;
                    }

                    if (r.name) {
                        if (!portfolioMap[r.name]) {
                            portfolioMap[r.name] = { cost: 0, val: 0, member: r.member };
                        }
                        if (r.action === 'buy') {
                            portfolioMap[r.name].cost += r.amount;
                            portfolioMap[r.name].val += (r.currentPrice || r.amount);
                        }
                    }
                }
            });

            const investPnl = investMarketValue - investCost;
            const netWorth = (totalIncome - totalExpense) + investMarketValue;

            // 更新頂部看板數字
            document.getElementById('total-net-worth').textContent = `NT$ ${netWorth.toLocaleString()}`;
            document.getElementById('month-income').textContent = `+${totalIncome.toLocaleString()}`;
            document.getElementById('month-expense').textContent = `-${totalExpense.toLocaleString()}`;
            document.getElementById('invest-pnl').textContent = `${investPnl >= 0 ? '+' : ''}${investPnl.toLocaleString()}`;

            document.getElementById('invest-cost').textContent = `NT$ ${investCost.toLocaleString()}`;
            document.getElementById('invest-market-value').textContent = `NT$ ${investMarketValue.toLocaleString()}`;
            document.getElementById('invest-count').textContent = `${Object.keys(portfolioMap).length} 筆持股`;

            // 渲染最近帳務列表
            const recentContainer = document.getElementById('recent-transactions');
            recentContainer.innerHTML = '';
            if (filteredRecords.length === 0) {
                recentContainer.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">目前尚無帳務紀錄</div>';
            } else {
                filteredRecords.slice(0, 10).forEach(item => {
                    const isIncome = item.type === 'income';
                    const isInvest = item.type === 'investment';
                    
                    let amountColor = 'text-rose-500';
                    let amountSign = '-';
                    if (isIncome) {
                        amountColor = 'text-emerald-500';
                        amountSign = '+';
                    } else if (isInvest) {
                        amountColor = 'text-indigo-600';
                        amountSign = '';
                    }

                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-2.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl transition';
                    div.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full ${isIncome ? 'bg-emerald-100 text-emerald-600' : isInvest ? 'bg-indigo-100 text-indigo-600' : 'bg-rose-100 text-rose-500'} flex items-center justify-center text-xs font-bold">
                                <i class="fa-solid ${isIncome ? 'fa-arrow-down' : isInvest ? 'fa-chart-line' : 'fa-basket-shopping'}"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                    ${item.name || item.category || '一般收支'}
                                    <span class="text-[10px] px-1.5 py-0.2 bg-slate-200 text-slate-600 rounded-md font-normal">${item.member}</span>
                                </div>
                                <div class="text-[11px] text-slate-400">${item.date} ${item.note ? '• ' + item.note : ''}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold ${amountColor}">${amountSign}NT$ ${item.amount.toLocaleString()}</div>
                            <button onclick="deleteRecord(${item.id})" class="text-[10px] text-slate-400 hover:text-rose-500 transition">刪除</button>
                        </div>
                    `;
                    recentContainer.appendChild(div);
                });
            }

            // 渲染投資持股明細頁面
            const portfolioContainer = document.getElementById('portfolio-list');
            portfolioContainer.innerHTML = '';
            const portfolioKeys = Object.keys(portfolioMap);
            if (portfolioKeys.length === 0) {
                portfolioContainer.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">目前尚無持有投資項目</div>';
            } else {
                portfolioKeys.forEach(key => {
                    const p = portfolioMap[key];
                    const diff = p.val - p.cost;
                    const roi = p.cost > 0 ? ((diff / p.cost) * 100).toFixed(2) : 0;
                    
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-slate-50 border border-slate-100 rounded-xl flex justify-between items-center';
                    div.innerHTML = `
                        <div>
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                ${key}
                                <span class="text-[10px] px-1.5 py-0.2 bg-indigo-50 text-indigo-600 rounded-md font-normal">${p.member}</span>
                            </div>
                            <div class="text-[11px] text-slate-400">投入成本: NT$ ${p.cost.toLocaleString()}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold text-slate-800">現值: NT$ ${p.val.toLocaleString()}</div>
                            <div class="text-[11px] font-bold ${diff >= 0 ? 'text-emerald-500' : 'text-rose-500'}">
                                ${diff >= 0 ? '+' : ''}${diff.toLocaleString()} (${roi}%)
                            </div>
                        </div>
                    `;
                    portfolioContainer.appendChild(div);
                });
            }

            renderCharts();
        }

        // 繪製與更新統計圖表
        function renderCharts() {
            const filteredRecords = records.filter(r => currentMemberFilter === 'all' || r.member === currentMemberFilter);
            
            // 1. 支出圖表資料
            const expenseMap = {};
            filteredRecords.filter(r => r.type === 'expense').forEach(r => {
                expenseMap[r.category] = (expenseMap[r.category] || 0) + r.amount;
            });

            const expLabels = Object.keys(expenseMap);
            const expData = Object.values(expenseMap);

            const ctxExp = document.getElementById('expenseChart');
            if (ctxExp) {
                if (expenseChart) expenseChart.destroy();
                expenseChart = new Chart(ctxExp, {
                    type: 'doughnut',
                    data: {
                        labels: expLabels.length ? expLabels : ['暫無資料'],
                        datasets: [{
                            data: expData.length ? expData : [1],
                            backgroundColor: ['#f43f5e', '#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#64748b']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                        }
                    }
                });
            }

            // 2. 投資組合圖表資料
            const assetMap = {};
            filteredRecords.filter(r => r.type === 'investment' && r.action === 'buy').forEach(r => {
                assetMap[r.name || '其他投資'] = (assetMap[r.name || '其他投資'] || 0) + (r.currentPrice || r.amount);
            });

            const assetLabels = Object.keys(assetMap);
            const assetData = Object.values(assetMap);

            const ctxAsset = document.getElementById('assetChart');
            if (ctxAsset) {
                if (assetChart) assetChart.destroy();
                assetChart = new Chart(ctxAsset, {
                    type: 'pie',
                    data: {
                        labels: assetLabels.length ? assetLabels : ['暫無投資'],
                        datasets: [{
                            data: assetData.length ? assetData : [1],
                            backgroundColor: ['#6366f1', '#06b6d4', '#10b981', '#ec4899', '#f59e0b']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                        }
                    }
                });
            }
        }

        // 底部導覽頁籤切換邏輯
        function initTabs() {
            const navItems = document.querySelectorAll('.nav-item[data-target]');
            const pages = [
                document.getElementById('page-dashboard'),
                document.getElementById('page-analytics'),
                document.getElementById('page-portfolio'),
                document.getElementById('page-settings')
            ];

            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const targetId = item.getAttribute('data-target');
                    if (!targetId) return;

                    // 切換頁面顯示
                    pages.forEach(page => {
                        if (page) {
                            if (page.id === targetId) {
                                page.classList.remove('hidden');
                            } else {
                                page.classList.add('hidden');
                            }
                        }
                    });

                    // 更新導覽列按鈕樣式
                    navItems.forEach(nav => {
                        if (nav.getAttribute('data-target') === targetId) {
                            nav.classList.remove('text-slate-400');
                            nav.classList.add('text-indigo-600');
                        } else {
                            nav.classList.remove('text-indigo-600');
                            nav.classList.add('text-slate-400');
                        }
                    });

                    // 重新渲染圖表 (防止畫布尺寸在隱藏狀態下繪製異常)
                    if (targetId === 'page-analytics') {
                        setTimeout(renderCharts, 50);
                    }
                });
            });

            // 查看全部按鈕切換至明細頁
            const viewAllBtn = document.getElementById('view-all-records');
            if (viewAllBtn) {
                viewAllBtn.addEventListener('click', () => {
                    const portfolioNav = document.querySelector('.nav-item[data-target="page-portfolio"]');
                    if (portfolioNav) portfolioNav.click();
                });
            }
        }

        // 初始化設定頁面事件
        function initSettingsEvents() {
            // 儲存成員暱稱
            document.getElementById('save-settings-btn').addEventListener('click', () => {
                const m1Val = document.getElementById('setting-member1').value.trim() || 'Sam';
                const m2Val = document.getElementById('setting-member2').value.trim() || 'Even';

                memberNames.m1 = m1Val;
                memberNames.m2 = m2Val;

                updateMemberNamesUI();
                saveData();

                showToast('已更新成員設定並儲存');
                renderApp();
            });

            // 重置為預設範例資料
            document.getElementById('reset-demo-btn').addEventListener('click', () => {
                records = [...defaultRecords];
                saveData();
                showToast('已恢復預設範例資料');
                renderApp();
            });

            // 清空所有紀錄
            document.getElementById('clear-all-btn').addEventListener('click', () => {
                records = [];
                saveData();
                showToast('已清空所有紀錄');
                renderApp();
            });
        }

        // 交易類型切換頁籤 (日常支出/收入/投資)
        function initTypeSwitch() {
            const typeBtns = document.querySelectorAll('.type-btn');
            const typeInput = document.getElementById('entry-type');
            const catWrapper = document.getElementById('category-wrapper');
            const investFields = document.getElementById('invest-fields');

            typeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    typeBtns.forEach(b => {
                        b.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                        b.classList.add('text-slate-500');
                    });
                    btn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                    btn.classList.remove('text-slate-500');

                    if (btn.id === 'type-expense') {
                        typeInput.value = 'expense';
                        catWrapper.classList.remove('hidden');
                        investFields.classList.add('hidden');
                    } else if (btn.id === 'type-income') {
                        typeInput.value = 'income';
                        catWrapper.classList.remove('hidden');
                        investFields.classList.add('hidden');
                    } else if (btn.id === 'type-investment') {
                        typeInput.value = 'investment';
                        catWrapper.classList.add('hidden');
                        investFields.classList.remove('hidden');
                    }
                });
            });
        }

        // 顯示 Toast 訊息
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // 刪除帳務紀錄
        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveData(); // 自動儲存至 localStorage
            showToast('已成功刪除紀錄');
            renderApp();
        }
    </script>
</body>
</html>
